<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management</title>
    <link rel="stylesheet" href="../admincss/adminorder.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="../admin/dashboard.html">📊 Dashboard</a>
        <a href="../admin/product.html">📦 Products</a>
        <a href="../admin/seller.html">🛍 Sellers</a>
        <a href="../admin/user.html">👥 Users</a>
        <a href="..admin/order.html">📋 Orders</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">

        <h1>Order Management</h1>

        <!-- Order Statistics -->
        <div class="stats">

            <div class="stat-card">
                <h2>Total Orders</h2>
                <p id="totalOrders">0</p>
            </div>

            <div class="stat-card">
                <h2>Pending Orders</h2>
                <p id="pendingOrders">0</p>
            </div>

            <div class="stat-card">
                <h2>Delivered Orders</h2>
                <p id="deliveredOrders">0</p>
            </div>

            <div class="stat-card">
                <h2>Cancelled Orders</h2>
                <p id="cancelledOrders">0</p>
            </div>

        </div>

        <!-- Orders Table -->
        <div class="card">
            <h2>Order List</h2>

            <table border="1" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="orderTable">

                    <!-- Sample Row -->
                    <tr>
                        <td>#ORD001</td>
                        <td>Rahul Sharma</td>
                        <td>Laptop</td>
                        <td>₹50,000</td>
                        <td>Pending</td>
                        <td>
                            <button>Process</button>
                            <button>Pending</button>
                            <button>Deliver</button>
                            <button>Cancel</button>
                        </td>
                    </tr>

                </tbody>
            </table>

        </div>

    </div>

    <script src="../adminjs/adminorder.js"></script>

</body>
</html>
