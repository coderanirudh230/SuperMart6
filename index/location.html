<!DOCTYPE html>
<html>
<head>
    <title>Delivery Address</title>
    <link rel="stylesheet" href="../style/location.css">
</head>
<body>

<h2>Add Delivery Address</h2>

<input type="text" id="name" placeholder="Full Name"><br><br>

<input type="text" id="mobile" placeholder="Mobile Number"><br><br>

<textarea id="address" placeholder="Full Address"></textarea><br><br>

<input type="text" id="city" placeholder="City"><br><br>

<input type="text" id="state" placeholder="State"><br><br>

<input type="text" id="pincode" placeholder="Pincode"><br><br>

<button onclick="saveAddress()">
Save Address
</button>

<script src="../js/location.js"></script>

</body>
</html>
