<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="../style/login.css">
</head>
<body>

    <div class="login-container">

        <div class="login-box">

            <h2>Welcome Back</h2>
            <p>Login to your SuperMart account</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <a href="#" class="forgot-password">
                    Forgot Password?
                </a>

                <p class="signup">
                    Don't have an account?
                    <a href="register.html">Register</a>
                </p>

            </form>

        </div>

    </div>

    <script src="../js/login.js"></script>

</body>
</html>
